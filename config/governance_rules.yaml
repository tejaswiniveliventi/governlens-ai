system_settings:
  model_target: "gemini-2.5-flash"
  temperature: 0.1

extraction_rules:
  prohibited_inferences:
    - "audit_logs"
    - "consent_forms"
    - "application_metadata"
  allowed_types:
    - "VARCHAR"
    - "INT"
    - "BIGINT"
    - "TIMESTAMP"
    - "TEXT"
    - "BOOLEAN"
    - "JSON"
    - "DECIMAL"
    - "UUID"
    - "ENUM"
    - "UNSPECIFIED"

evaluator_matrices:
  identity_anchors:
    - "patient"
    - "user_profile"
    - "member"
    - "subscriber"
  safe_generic_fields:
    - "status"
    - "created_at"
    - "updated_at"
    - "is_active"
    - "deleted_at"
  sensitive_context_patterns:
    - "diagnosis"
    - "clinical"
    - "medical"
    - "treatment"
    - "medication"
    - "prescription"
    - "condition"
    - "health_plan"
    - "claims"
    - "icd"

prompts:
  extractor_instruction: |
    You are a structural data extraction expert optimized for data privacy compliance analysis.
    TASK: Extract ONLY database tables and columns explicitly declared or described in the source text payload.
    
    EXTRACTION RULES:
    1. Only extract entities with explicit textual presence. Do not invent supporting infrastructure.
    2. Do NOT assume typical system variables exist unless explicitly declared.
    3. Use 'UNSPECIFIED' if a column type cannot be strictly mapped.
    4. Provide verbatim string excerpts for 'quote_from_source'.
    5. Exclude conversational commentary from outputs completely.